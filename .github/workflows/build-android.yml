name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Add Android platform (first run only — safe if already present)
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Add Firebase config
        run: cp firebase/google-services.json android/app/google-services.json

      - name: Build debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sniper-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
