<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sniper Admin</title>
<style>
  :root { --bg:#000; --surface:#16181c; --border:#2f3336; --text:#e7e9ea; --sub:#71767b; --green:#39ff88; --purple:#a855f7; --red:#f4212e; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin:0; padding:16px; max-width:480px; margin:0 auto; }
  h1 { font-size:22px; }
  .card { border:1px solid var(--border); border-radius:12px; padding:16px; margin:16px 0; }
  label { font-size:13px; color:var(--sub); display:block; margin-bottom:6px; }
  input, select { width:100%; background:transparent; border:1px solid var(--border); border-radius:8px; padding:10px; color:var(--text); font-size:15px; margin-bottom:10px; }
  button { width:100%; border-radius:9999px; padding:12px; font-weight:700; border:1px solid var(--border); background:transparent; color:var(--text); font-size:15px; cursor:pointer; }
  button.primary { background:var(--purple); border-color:var(--purple); color:#fff; }
  .status { font-size:14px; margin-top:8px; }
  .ok { color: var(--green); }
  .err { color: var(--red); }
  .toggle-row { display:flex; align-items:center; justify-content:space-between; }
  .badge { padding:4px 10px; border-radius:9999px; font-size:12px; font-weight:700; }
  .badge-on { background: rgba(57,255,136,0.15); color: var(--green); }
  .badge-off { background: rgba(244,33,46,0.15); color: var(--red); }
  #secretGate { text-align:center; margin-top:80px; }
</style>
</head>
<body>

<div id="secretGate">
  <h1>Sniper Admin</h1>
  <label>Admin secret</label>
  <input id="secretInput" type="password" placeholder="Enter admin secret" />
  <button class="primary" onclick="unlock()">Unlock</button>
  <p id="gateError" class="status err"></p>
</div>

<div id="panel" style="display:none">
  <h1>Sniper Admin</h1>

  <div class="card">
    <div class="toggle-row">
      <div>
        <div style="font-weight:700">Real Funding & Betting</div>
        <div style="color:var(--sub); font-size:13px">Controls Paystack funding + real balance checks</div>
      </div>
      <span id="modeBadge" class="badge">...</span>
    </div>
    <button id="toggleBtn" style="margin-top:12px" onclick="toggleFunding()">Loading...</button>
    <p id="toggleStatus" class="status"></p>
  </div>

  <div class="card">
    <div style="font-weight:700; margin-bottom:10px">Grant Test Coins</div>
    <p style="color:var(--sub); font-size:13px; margin-top:0">Only works while real funding is disabled.</p>
    <label>Username</label>
    <input id="grantUsername" placeholder="e.g. Jeremiah" />
    <label>Amount (coins)</label>
    <input id="grantAmount" type="number" placeholder="e.g. 500" />
    <button class="primary" onclick="grantCoins()">Add Coins</button>
    <p id="grantStatus" class="status"></p>
  </div>

  <div class="card">
    <div style="font-weight:700; margin-bottom:10px">Users</div>
    <button onclick="loadUsers()">Refresh list</button>
    <div id="userList" style="margin-top:12px"></div>
  </div>
</div>

<script>
const FUNCTION_URL = "https://edwtwflqjuhzkuzhmhfm.supabase.co/functions/v1/admin-panel";
let adminSecret = "";
let currentMode = null;

function unlock() {
  adminSecret = document.getElementById("secretInput").value;
  if (!adminSecret) return;
  getSettings();
}

async function call(action, extra) {
  const res = await fetch(FUNCTION_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-admin-secret": adminSecret },
    body: JSON.stringify({ action, ...extra }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

async function getSettings() {
  try {
    const data = await call("get_settings");
    document.getElementById("secretGate").style.display = "none";
    document.getElementById("panel").style.display = "block";
    setMode(data.real_funding_enabled);
  } catch (e) {
    document.getElementById("gateError").textContent = e.message;
  }
}

function setMode(enabled) {
  currentMode = enabled;
  const badge = document.getElementById("modeBadge");
  const btn = document.getElementById("toggleBtn");
  if (enabled) {
    badge.textContent = "REAL FUNDING ON";
    badge.className = "badge badge-on";
    btn.textContent = "Disable real funding (test mode)";
  } else {
    badge.textContent = "TEST MODE (no real money)";
    badge.className = "badge badge-off";
    btn.textContent = "Enable real funding (production)";
  }
}

async function toggleFunding() {
  const statusEl = document.getElementById("toggleStatus");
  statusEl.textContent = "Updating...";
  statusEl.className = "status";
  try {
    const data = await call("set_real_funding", { enabled: !currentMode });
    setMode(data.real_funding_enabled);
    statusEl.textContent = "Updated.";
    statusEl.className = "status ok";
  } catch (e) {
    statusEl.textContent = e.message;
    statusEl.className = "status err";
  }
}

async function grantCoins() {
  const username = document.getElementById("grantUsername").value.trim();
  const amount = Number(document.getElementById("grantAmount").value);
  const statusEl = document.getElementById("grantStatus");
  if (!username || !amount) {
    statusEl.textContent = "Enter a username and amount.";
    statusEl.className = "status err";
    return;
  }
  statusEl.textContent = "Adding...";
  statusEl.className = "status";
  try {
    await call("add_coins", { username, amount_cents: Math.round(amount * 100) });
    statusEl.textContent = `Added ${amount} coins to ${username}.`;
    statusEl.className = "status ok";
    loadUsers();
  } catch (e) {
    statusEl.textContent = e.message;
    statusEl.className = "status err";
  }
}

async function loadUsers() {
  const listEl = document.getElementById("userList");
  listEl.textContent = "Loading...";
  try {
    const data = await call("list_users");
    listEl.innerHTML = data.users.map(u => {
      const bal = u.wallets?.[0]?.balance_cents ?? u.wallets?.balance_cents ?? 0;
      return `<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border)">
        <span>${u.username}</span>
        <span style="color:var(--green)">🪙${(bal/100).toFixed(2)}</span>
      </div>`;
    }).join("");
  } catch (e) {
    listEl.textContent = e.message;
  }
}
</script>
</body>
</html>
